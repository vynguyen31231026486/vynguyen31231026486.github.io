<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Anh hùng diệt Rồng</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body{
      min-height: 100vh;
      background: radial-gradient(circle at top,#243b55,#141e30);
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .battle-card{
      width: 100%;
      max-width: 900px;
      background: rgba(0,0,0,.4);
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,.6);
    }
    .battle-header{
      text-align:center;
      margin-bottom:18px;
    }
    .battle-header h1{
      font-size:26px;
      margin-bottom:4px;
      letter-spacing:1px;
    }
    .battle-header span{
      font-size:13px;
      color:#ccc;
    }
    .arena{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:18px;
    }
    .fighter{
      flex:1;
      text-align:center;
      position:relative;
    }
    .fighter-name{
      font-weight:bold;
      margin-bottom:6px;
      letter-spacing:1px;
    }
    .avatar{
      width:150px;
      height:150px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:70px;
      margin:0 auto 10px;
      background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.02));
      border:2px solid rgba(255,255,255,.25);
      box-shadow:0 10px 25px rgba(0,0,0,.6);
    }
    .stats{
      font-size:12px;
      color:#ddd;
      margin-bottom:8px;
    }
    .hp-bar{
      width:100%;
      height:16px;
      border-radius:999px;
      background:rgba(0,0,0,.45);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.2);
    }
    .hp-fill{
      height:100%;
      width:100%;
      transition:width .25s;
    }
    .hp-hero{ background:linear-gradient(90deg,#6ef195,#35d37e); }
    .hp-dragon{ background:linear-gradient(90deg,#ff6363,#9b2c91); }

    .vs-label{
      font-size:26px;
      margin-bottom:80px;
      font-weight:bold;
      color:#ffea7a;
      text-shadow:0 0 8px rgba(0,0,0,.7);
    }

    .controls{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      gap:10px;
      flex-wrap:wrap;
    }
    .buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    button{
      border:none;
      padding:10px 22px;
      border-radius:999px;
      cursor:pointer;
      font-size:14px;
      font-weight:500;
      letter-spacing:.5px;
      transition:transform .15s, box-shadow .15s, background .15s;
    }
    #btnTurn{
      background:#ffb703;
      color:#222;
      box-shadow:0 8px 18px rgba(0,0,0,.4);
    }
    #btnTurn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 24px rgba(0,0,0,.6);
    }
    #btnReset{
      background:#3d5a80;
      color:#fff;
    }
    #btnReset:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 18px rgba(0,0,0,.5);
    }
    .status{
      font-size:13px;
      color:#eee;
    }
    .log{
      background:rgba(0,0,0,.6);
      border-radius:14px;
      padding:10px 12px;
      max-height:220px;
      overflow-y:auto;
      font-size:12px;
    }
    .log-entry{
      margin-bottom:6px;
      line-height:1.3;
    }
    .log-entry.hero{ color:#9be7ff; }
    .log-entry.dragon{ color:#ff9b9b; }
    .log-entry.system{ color:#ffeaa7; }

    .hit{
      animation: hit .3s;
    }
    @keyframes hit{
      0%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-4px); }
      80%{ transform:translateX(4px); }
      100%{ transform:translateX(0); }
    }
    .dodge{
      animation: dodge .35s;
    }
    @keyframes dodge{
      0%{ transform:translateY(0); opacity:1; }
      50%{ transform:translateY(-14px); opacity:.6; }
      100%{ transform:translateY(0); opacity:1; }
    }
  </style>
</head>
<body>

<div class="battle-card">
  <div class="battle-header">
    <h1>TRẬN CHIẾN ANH HÙNG – DIỆT RỒNG</h1>
    <span>Hero tấn công trước, rồng phản công sau. Né đòn, chí mạng, tất cả do số phận quyết định!</span>
  </div>

  <div class="arena">
    <!-- Anh hùng -->
    <div class="fighter" id="heroBox">
      <div class="fighter-name">ANH HÙNG</div>
      <div class="avatar">
        <img src="https://png.pngtree.com/png-vector/20250913/ourlarge/pngtree-brave-cartoon-knight-ready-for-adventure-png-image_17435123.webp"
             alt="Anh hùng" style="width:100%; height:100%; border-radius:18px;">
      </div>
      <div class="stats" id="heroStats"></div>
      <div class="hp-bar">
        <div class="hp-fill hp-hero" id="heroHpFill"></div>
      </div>
      <div class="stats" id="heroHpText"></div>
    </div>

    <div class="vs-label">VS</div>

    <!-- Rồng -->
    <div class="fighter" id="dragonBox">
      <div class="fighter-name">HỎA LONG</div>
      <div class="avatar">🐉</div>
      <div class="stats" id="dragonStats"></div>
      <div class="hp-bar">
        <div class="hp-fill hp-dragon" id="dragonHpFill"></div>
      </div>
      <div class="stats" id="dragonHpText"></div>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="btnTurn">RA ĐÒN!</button>
      <button id="btnReset">Chơi lại</button>
    </div>
    <div class="status" id="statusText">Nhấn "RA ĐÒN!" để bắt đầu hiệp đấu.</div>
  </div>

  <div class="log" id="logBox"></div>
</div>

<script src="dietrong.js" defer></script>
</body>
</html>
