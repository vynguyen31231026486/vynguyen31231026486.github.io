<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lời yêu thương 💌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Màu nền dịu nhẹ, lãng mạn hơn */
      background: linear-gradient(135deg,#a1c4fd,#c2e9fb,#d4fc79,#96e6a1);
      overflow: hidden;
    }

    .card {
      background: #fff;
      padding: 36px 48px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
      min-width: 360px;
      max-width: 450px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      background:rgba(255,192,203,0.35);
      top:-70px;
      right:-70px;
      z-index:-1;
    }

    .title {
      font-size: 24px;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: #ff6b81;
    }

    .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
    }

    .divider {
      color: #ccc;
      font-size: 20px;
      user-select: none;
    }

    button {
      border: none;
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, background .2s, color .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #yesBtn {
      background: #ff6b81;
      color: #fff;
      box-shadow: 0 8px 18px rgba(255,107,129,.4);
    }
    #yesBtn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 22px rgba(255,107,129,.55);
    }

    #noBtn {
      background: #f3f3f3;
      color: #333;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }
    #noBtn:hover {
      background: #ececec;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
    }

    .icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Giao diện sẽ được JS render -->

  <!-- Link tới file JS riêng -->
  <script src="loiyeuthuong.js"></script>
</body>
</html>
